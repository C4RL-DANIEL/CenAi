name: Rust Native CI

on:
  push:
    branches:
      - main
      - "rewrite/**"
    paths:
      - "native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-native.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-native.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rust:
    name: Rust workspace checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply and commit canonical Rust formatting
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rewrite/')
        run: |
          # rustfmt can expose a second-order diff in deeply nested expressions.
          # Run twice, then require the exact same strict check used below.
          cargo fmt --all
          cargo fmt --all
          cargo fmt --all -- --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add native
            git commit -m "style: apply rustfmt formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
