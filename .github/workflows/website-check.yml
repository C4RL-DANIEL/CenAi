name: Website checks
on:
  push:
    branches: [ main, "feat/**", cloudflare-migration ]
    paths:
      - "website/**"
      - "supabase/**"
      - ".github/workflows/website-check.yml"
  pull_request:
    paths:
      - "website/**"
      - "supabase/**"
      - ".github/workflows/website-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Cloudflare Pages assets
        working-directory: website
        run: |
          npm run check
          npm run build
          test -s dist/index.html
          test -s dist/admin/index.html
          test -s dist/_worker.js
          test -s dist/styles.css
          test -s dist/editorial.css
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/guides/index.html
          test -s dist/guides/choosing-ai-models.html
          test -s dist/privacy.html
          test -s dist/terms.html
          test ! -e dist/api/admin.js
          test ! -e dist/api/email-otp.js
          test ! -e dist/ADMIN-SETUP.md
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check PayPal and admin control-plane Edge Functions
        run: |
          for function in cenai-ai-quota cenai-billing cenai-control-plane cenai-email-otp cenai-paypal-billing cenai-public-api cenai-telemetry; do
            deno check --no-lock "supabase/functions/$function/index.ts"
          done

      - name: Verify Cloudflare API and recovery routes
        run: |
          set -euo pipefail
          grep -q 'cenai-email-otp' website/worker.js
          grep -q 'cenai-control-plane' website/worker.js
          grep -q 'cenai-paypal-billing' website/worker.js
          grep -q 'create_customer_refund_request' supabase/functions/cenai-paypal-billing/index.ts
          grep -q 'issue_admin' website/api/email-otp.js
          grep -q 'verify_admin' website/api/email-otp.js
          grep -q 'email MFA fallback' website/admin/admin.js
          node - <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("website/worker.js", "utf8");
          if (!source.includes('message.replace(/(^|\\\\r\\\\n)\\\\./g, "$1..") + "\\\\r\\\\n.\\\\r\\\\n"')) {
            throw new Error("SMTP DATA must dot-stuff content but preserve the single-dot terminator");
          }
          if (source.includes('.replace(/\\\\r?\\\\n\\\\./g, "\\\\r\\\\n..")')) {
            throw new Error("Legacy SMTP formatter still corrupts the DATA terminator");
          }
          const body = "Subject: test\\r\\n\\r\\n.first line\\r\\n..second line";
          const formatted = body.replace(/(^|\\r\\n)\\./g, "$1..") + "\\r\\n.\\r\\n";
          if (!formatted.endsWith("\\r\\n.\\r\\n") || formatted.endsWith("\\r\\n..\\r\\n")) {
            throw new Error("SMTP terminator regression test failed");
          }
          console.log("SMTP DATA terminator regression test passed.");
          NODE
          node --check website/api/email-otp.js
          grep -q 'recurringBillingEnabled' supabase/functions/cenai-paypal-billing/index.ts
          grep -q 'billing.recurring_enabled' supabase/migrations/20261118134515_pause_unverified_recurring_paypal.sql
          grep -q 'Recurring subscription temporarily paused' website/account.js
          grep -q 'Recurring subscription temporarily paused' website/billing.js
          grep -q 'admin_decide_refund_request' supabase/functions/cenai-paypal-billing/index.ts
          grep -q 'billing_refund_requests' supabase/migrations/20261118133800_customer_refund_requests.sql
          grep -q 'billing_refund_requests_reviewed_by_idx' supabase/migrations/20261118133934_index_refund_request_reviewer.sql
          grep -q 'site_pages_updated_by_idx' supabase/migrations/20261118134037_index_foreign_keys_and_dedupe_site_page_policy.sql
          grep -q 'customer-refund-form' website/account.html
          grep -q 'refund-requests-content' website/admin/index.html
          for script in website/*.js website/api/*.js website/api/v1/*.js website/admin/*.js; do node --check "$script"; done
          grep -q 'cenai-ai-quota' website/worker.js
          grep -q 'cenai_reserve_ai_request' supabase/migrations/20261116142000_add_cloud_ai_quota_reservation.sql
          grep -q 'api/site-pages' website/worker.js
          grep -q 'api/releases' website/worker.js
          grep -q 'cenai-website.cenai-app.workers.dev/reset-password' website/reset-password.js
          grep -q 'site_pages_public_read' supabase/migrations/20261116135000_tighten_cms_and_quota_table_access.sql
          grep -q 'cenai_issue_email_otp_for_user' supabase/migrations/20261116135500_secure_email_otp_service_role_only.sql
          echo "Cloudflare site build and backend route checks passed."

      - name: Smoke test production Cloudflare Worker
        run: |
          set -euo pipefail
          BASE="https://cenai-website.cenai-app.workers.dev"
          status=""
          for attempt in $(seq 1 10); do
            status=$(curl -sS --max-time 15 -o /tmp/cenai-health.json -w "%{http_code}" "$BASE/api/health" || true)
            if [[ "$status" == "200" ]]; then break; fi
            sleep 3
          done
          if [[ "$status" != "200" ]]; then
            cat /tmp/cenai-health.json 2>/dev/null || true
            echo "Cloudflare Worker health endpoint returned $status"
            exit 1
          fi
          node -e 'const h=require("/tmp/cenai-health.json"); if(h.service!=="cenai-website" || h.status!=="online") process.exit(1)'
          for route in / /admin /beta /billing /account /reset-password /billing/success /billing/cancel /updates.html /security.html /roadmap.html /api.html /about.html /privacy.html /terms.html /contact.html /guides/ /guides/choosing-ai-models.html /guides/approval-first-agents.html /guides/organizing-ai-projects.html /guides/local-vs-cloud-ai.html /guides/checking-ai-answers.html /robots.txt /sitemap.xml; do
            code=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" "$BASE$route")
            if [[ "$code" != "200" ]]; then echo "$route returned $code"; exit 1; fi
          done
          for endpoint in admin beta; do
            code=$(curl -sS --max-time 15 -o "/tmp/cenai-$endpoint.json" -w "%{http_code}" -X POST -H "Content-Type: application/json" --data '{"action":"admin_preflight"}' "$BASE/api/$endpoint")
            if [[ "$code" != "401" ]]; then cat "/tmp/cenai-$endpoint.json"; echo "Expected 401 from /api/$endpoint, got $code"; exit 1; fi
          done
          billing_code=$(curl -sS --max-time 20 -o /tmp/cenai-billing-auth.json -w "%{http_code}" -X POST -H "Content-Type: application/json" --data '{"action":"list_customer_refunds"}' "$BASE/api/functions/cenai-paypal-billing")
          if [[ "$billing_code" != "401" ]]; then cat /tmp/cenai-billing-auth.json; echo "Expected 401 from unauthenticated billing API, got $billing_code"; exit 1; fi
          curl -fsS "$BASE/account" -o /tmp/cenai-account.html
          grep -q 'Request a refund' /tmp/cenai-account.html
          curl -fsS "$BASE/admin" -o /tmp/cenai-admin.html
          grep -q 'Customer refund requests' /tmp/cenai-admin.html
          curl -fsS "$BASE/api/admin-config" -o /tmp/cenai-admin-config.json
          grep -q "bqkzehozezvepbthglyj.supabase.co" /tmp/cenai-admin-config.json
          curl -fsS "$BASE/api/site-pages" >/tmp/cenai-pages.json
          curl -fsS "$BASE/robots.txt" -o /tmp/cenai-robots.txt
          grep -q "Sitemap:" /tmp/cenai-robots.txt
          curl -fsS "$BASE/sitemap.xml" -o /tmp/cenai-sitemap.xml
          grep -q "guides/choosing-ai-models.html" /tmp/cenai-sitemap.xml

          ai_code=$(curl -sS --max-time 15 -o /tmp/cenai-ai.json -w "%{http_code}" -X POST -H "Content-Type: application/json" --data '{"model":"cloudflare-gemma-4-26b-a4b-it","messages":[{"role":"user","content":"health check"}]}' "$BASE/api/ai/chat/completions")
          if [[ "$ai_code" != "401" ]]; then cat /tmp/cenai-ai.json; echo "Expected 401 from unauthenticated AI endpoint, got $ai_code"; exit 1; fi
          echo "Cloudflare Worker health, public pages, API authentication and Supabase configuration passed."
