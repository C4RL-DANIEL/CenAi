name: Rust Android Debug APK

on:
  push:
    branches:
      - "rewrite/**"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - "app-rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle/**"
      - ".github/workflows/rust-android-debug.yml"
  workflow_dispatch:

concurrency:
  # Keep the newest source snapshot moving through build and emulator checks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Rust-native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: cargo ndk -t arm64-v8a -t x86_64 -o app-rust/src/main/jniLibs build --release -p cenai-native
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app-rust:assembleDebug
      - name: Verify NativeActivity on API 35 emulator
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300000
          script: |
            adb install app-rust/build/outputs/apk/debug/app-rust-debug.apk
            timeout 45s adb shell am start -W -n com.cenai.app.rustdebug/com.cenai.app.CenAiNativeActivity
            for attempt in $(seq 1 30); do
              if adb shell pidof com.cenai.app.rustdebug >/dev/null 2>&1; then
                echo "CenAI NativeActivity process is running."
                exit 0
              fi
              sleep 1
            done
            adb logcat -d -t 500
            echo "CenAI NativeActivity did not remain running." >&2
            exit 1
      - name: Generate checksum
        run: sha256sum app-rust/build/outputs/apk/debug/app-rust-debug.apk > app-rust/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cenai-rust-native-debug
          path: |
            app-rust/build/outputs/apk/debug/app-rust-debug.apk
            app-rust/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
