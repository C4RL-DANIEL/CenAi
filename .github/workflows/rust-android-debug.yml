name: Rust Android Debug APK

on:
  push:
    branches:
      - "rewrite/**"
    paths:
      - "native/**"
      - "app-rust/**"
      - "external/**"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle/**"
      - ".github/scripts/verify-rust-native-activity.sh"
      - ".github/workflows/rust-android-debug.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - "app-rust/**"
      - "external/**"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle/**"
      - ".github/workflows/rust-android-debug.yml"
  workflow_dispatch:

concurrency:
  # Cancel stale snapshots within each GitHub event stream before starting the newest build.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Rust-native Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: cargo ndk -t arm64-v8a -t x86_64 -o app-rust/src/main/jniLibs build --release -p cenai-native
      - name: Download and verify pinned Lightning model
        run: |
          mkdir -p app-rust/src/main/assets/models
          model=app-rust/src/main/assets/models/lightning.litertlm
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6687177e00897731e7716267eebd4eba0dde7c2/Qwen3-0.6B.litertlm" \
            --output "$model"
          echo "c5f39b4191926786c3e6668b62af4d6eb15248dfc7a5348252a9b406f33f2108  $model" | sha256sum --check --strict
          test "$(stat -c '%s' "$model")" = "613722264"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK and Lightning instrumentation tests
        run: gradle --no-daemon :app-rust:assembleDebug :app-rust:assembleDebugAndroidTest
      - name: Compile retained Kotlin migration compatibility layer
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Verify NativeActivity smoke-test script syntax
        run: bash -n .github/scripts/verify-rust-native-activity.sh
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Verify NativeActivity on API 35 emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900000
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -memory 4096
          script: bash .github/scripts/verify-rust-native-activity.sh
      - name: Generate checksum
        run: sha256sum app-rust/build/outputs/apk/debug/app-rust-debug.apk > app-rust/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenai-rust-native-debug
          path: |
            app-rust/build/outputs/apk/debug/app-rust-debug.apk
            app-rust/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
