name: Rust Android Debug APK

on:
  push:
    branches:
      - "rewrite/**"
  pull_request:
    branches:
      - main
    paths:
      - "native/**"
      - "app-rust/**"
      - "external/**"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle/**"
      - ".github/workflows/rust-android-debug.yml"
  workflow_dispatch:

concurrency:
  # Keep the newest source snapshot moving through build and emulator checks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Rust-native Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: cargo ndk -t arm64-v8a -t x86_64 -o app-rust/src/main/jniLibs build --release -p cenai-native
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app-rust:assembleDebug
      - name: Verify NativeActivity smoke-test script syntax
        run: bash -n .github/scripts/verify-rust-native-activity.sh
      - name: Verify NativeActivity on API 35 emulator
        env:
          # GitHub-hosted Linux runners do not expose KVM. Android Emulator refuses
          # to start with -accel off unless this explicit TCG opt-in is present.
          ANDROID_I_WANT_MY_TCG: "yes"
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 840000
          script: bash .github/scripts/verify-rust-native-activity.sh
      - name: Generate checksum
        run: sha256sum app-rust/build/outputs/apk/debug/app-rust-debug.apk > app-rust/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenai-rust-native-debug
          path: |
            app-rust/build/outputs/apk/debug/app-rust-debug.apk
            app-rust/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
