name: Android CI
on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
    paths:
      - "AndroidApp/**"
      - "app/**"
      - "core/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle.properties"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "AndroidApp/**"
      - "app/**"
      - "core/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradle.properties"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: cenai-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK and NDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Test Rust core
        working-directory: core
        run: cargo test
      - name: Build Rust JNI library
        working-directory: core
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release
      - name: Check website JavaScript syntax
        run: |
          node --check website/admin/admin.js
          node --check website/home.js
          node --check website/beta.js
          node --check website/api/admin.js
          node --check website/api/beta.js
          node --check website/api/site-pages.js
      - name: Cache pinned Lightning model and license
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models/lightning.litertlm
            app/src/main/assets/licenses/Apache-2.0.txt
          key: lightning-qwen3-0.6b-int8-c5f39b4191926786c3e6668b62af4d6eb15248dfc7a5348252a9b406f33f2108
      - name: Download and verify bundled Lightning model
        env:
          LIGHTNING_MODEL_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6687177e00897731e7716267eebd4eba0dde7c2/Qwen3-0.6B.litertlm
          LIGHTNING_MODEL_SHA256: c5f39b4191926786c3e6668b62af4d6eb15248dfc7a5348252a9b406f33f2108
          LIGHTNING_MODEL_SIZE: 613722264
          LICENSE_URL: https://www.apache.org/licenses/LICENSE-2.0.txt
        run: |
          mkdir -p app/src/main/assets/models app/src/main/assets/licenses
          MODEL=app/src/main/assets/models/lightning.litertlm
          if [[ ! -s "$MODEL" ]]; then
            curl --location --fail --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1200 "$LIGHTNING_MODEL_URL" --output "$MODEL.part"
            mv "$MODEL.part" "$MODEL"
          fi
          echo "$LIGHTNING_MODEL_SHA256  $MODEL" | sha256sum --check -
          test "$(stat -c%s "$MODEL")" = "$LIGHTNING_MODEL_SIZE"
          LICENSE=app/src/main/assets/licenses/Apache-2.0.txt
          if [[ ! -s "$LICENSE" ]]; then
            curl --location --fail --retry 5 --retry-all-errors --connect-timeout 30 --max-time 120 "$LICENSE_URL" --output "$LICENSE"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run JVM unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Generate debug APK SHA-256
        if: success()
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Check release signing readiness without exposing secrets
        id: signing_readiness
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CENAI_KEYSTORE_BASE64: ${{ secrets.CENAI_KEYSTORE_BASE64 }}
          CENAI_KEYSTORE_PASSWORD: ${{ secrets.CENAI_KEYSTORE_PASSWORD }}
          CENAI_KEY_ALIAS: ${{ secrets.CENAI_KEY_ALIAS }}
          CENAI_KEY_PASSWORD: ${{ secrets.CENAI_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$CENAI_KEYSTORE_BASE64" ]] || missing+=(CENAI_KEYSTORE_BASE64)
          [[ -n "$CENAI_KEYSTORE_PASSWORD" ]] || missing+=(CENAI_KEYSTORE_PASSWORD)
          [[ -n "$CENAI_KEY_ALIAS" ]] || missing+=(CENAI_KEY_ALIAS)
          [[ -n "$CENAI_KEY_PASSWORD" ]] || missing+=(CENAI_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'ready=false\nmissing=%s\n' "${missing[*]}" > release-signing-readiness.txt
            echo "Release signing is not fully configured. Missing secret names: ${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf 'ready=true\nmissing=none\n' > release-signing-readiness.txt
            echo "Release signing secrets are present. Values were not printed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload signing readiness result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CenAI-signing-readiness
          path: release-signing-readiness.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable on this runner; Android emulator smoke tests require hardware acceleration."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
      - name: Run Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900000
          disable-linux-hw-accel: false
          script: timeout 900s gradle connectedDebugAndroidTest --stacktrace
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CenAI-android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CenAI-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: warn
          retention-days: 30
      - name: Require bundled Lightning model for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MODEL="app/src/main/assets/models/lightning.litertlm"
          test -s "$MODEL" || { echo "::error::The bundled Lightning model is missing. Refusing to publish an incomplete release APK."; exit 1; }
          if head -c 80 "$MODEL" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "::error::Lightning model is only a Git LFS pointer, not bundled model weights."; exit 1
          fi
          sha256sum "$MODEL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CENAI_KEYSTORE_BASE64: ${{ secrets.CENAI_KEYSTORE_BASE64 }}
          CENAI_KEYSTORE_PASSWORD: ${{ secrets.CENAI_KEYSTORE_PASSWORD }}
          CENAI_KEY_ALIAS: ${{ secrets.CENAI_KEY_ALIAS }}
          CENAI_KEY_PASSWORD: ${{ secrets.CENAI_KEY_PASSWORD }}
        run: |
          test -n "$CENAI_KEYSTORE_BASE64" || (echo "::error::Configure CENAI_KEYSTORE_BASE64 and the other signing secrets before tagging a release." && exit 1)
          test -n "$CENAI_KEYSTORE_PASSWORD"
          test -n "$CENAI_KEY_ALIAS"
          test -n "$CENAI_KEY_PASSWORD"
          echo "$CENAI_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          echo "CENAI_KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          echo "CENAI_KEYSTORE_PASSWORD=$CENAI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CENAI_KEY_ALIAS=$CENAI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CENAI_KEY_PASSWORD=$CENAI_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.-' read -r MAJOR MINOR PATCH PRE_TYPE PRE_NUM <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          if [[ "$VERSION" == *-* ]]; then
            PRE_NUM=${PRE_NUM:-1}
          else
            PRE_NUM=99
          fi
          CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + PRE_NUM))
          echo "CENAI_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "CENAI_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease
      - name: Verify release APK signature and generate SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: CenAI-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
