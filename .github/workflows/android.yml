name: Android CI
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK and NDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust JNI library
        working-directory: core
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release
      - name: Check website JavaScript syntax
        run: |
          node --check website/admin/admin.js
          node --check website/home.js
          node --check website/beta.js
          node --check website/api/admin.js
          node --check website/api/beta.js
          node --check website/api/site-pages.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Check release signing readiness without exposing secrets
        if: github.event_name == 'pull_request'
        env:
          CENAI_KEYSTORE_BASE64: ${{ secrets.CENAI_KEYSTORE_BASE64 }}
          CENAI_KEYSTORE_PASSWORD: ${{ secrets.CENAI_KEYSTORE_PASSWORD }}
          CENAI_KEY_ALIAS: ${{ secrets.CENAI_KEY_ALIAS }}
          CENAI_KEY_PASSWORD: ${{ secrets.CENAI_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$CENAI_KEYSTORE_BASE64" ]] || missing+=(CENAI_KEYSTORE_BASE64)
          [[ -n "$CENAI_KEYSTORE_PASSWORD" ]] || missing+=(CENAI_KEYSTORE_PASSWORD)
          [[ -n "$CENAI_KEY_ALIAS" ]] || missing+=(CENAI_KEY_ALIAS)
          [[ -n "$CENAI_KEY_PASSWORD" ]] || missing+=(CENAI_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "Release signing is not fully configured. Missing secret names: ${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Release signing secrets are present. Values were not printed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle connectedDebugAndroidTest
      - name: Generate debug APK SHA-256
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: CenAI-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CENAI_KEYSTORE_BASE64: ${{ secrets.CENAI_KEYSTORE_BASE64 }}
          CENAI_KEYSTORE_PASSWORD: ${{ secrets.CENAI_KEYSTORE_PASSWORD }}
          CENAI_KEY_ALIAS: ${{ secrets.CENAI_KEY_ALIAS }}
          CENAI_KEY_PASSWORD: ${{ secrets.CENAI_KEY_PASSWORD }}
        run: |
          test -n "$CENAI_KEYSTORE_BASE64" || (echo "::error::Configure CENAI_KEYSTORE_BASE64 and the other signing secrets before tagging a release." && exit 1)
          test -n "$CENAI_KEYSTORE_PASSWORD"
          test -n "$CENAI_KEY_ALIAS"
          test -n "$CENAI_KEY_PASSWORD"
          echo "$CENAI_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          echo "CENAI_KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          echo "CENAI_KEYSTORE_PASSWORD=$CENAI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CENAI_KEY_ALIAS=$CENAI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CENAI_KEY_PASSWORD=$CENAI_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.-' read -r MAJOR MINOR PATCH PRE_TYPE PRE_NUM <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          if [[ "$VERSION" == *-* ]]; then
            PRE_NUM=${PRE_NUM:-1}
          else
            PRE_NUM=99
          fi
          CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + PRE_NUM))
          echo "CENAI_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "CENAI_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease
      - name: Verify release APK signature and generate SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: CenAI-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
