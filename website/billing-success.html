<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PayPal return · CenAI</title><link rel="stylesheet" href="/styles.css"><style>body{background:#090d18;color:#edf2ff;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:560px;padding:32px;border:1px solid #293650;border-radius:22px;background:#111a2b}.muted{color:#aab6ce;line-height:1.6}.button{margin:8px 8px 0 0}</style></head><body><main class="box"><div class="eyebrow">PAYPAL CHECKOUT</div><h1>PayPal returned you to CenAI</h1><p class="muted">Your approval is being processed. Subscription activation is confirmed by a verified PayPal webhook, not by this return page alone. Sign in to CenAI to check your subscription status.</p><a class="button button-primary" href="/billing">Return to billing</a><a class="button button-quiet" href="/">Home</a><p id="activation-status" class="muted" aria-live="polite">Checking PayPal confirmation…</p><script>
(async()=>{const el=document.getElementById("activation-status");try{const session=JSON.parse(localStorage.getItem("cenai.account.session.v1")||"null");if(!session?.access_token){el.textContent="Sign in to your CenAI account to verify activation. Access is granted only after PayPal confirms an active subscription.";return;}const r=await fetch("/api/functions/cenai-paypal-billing",{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_l6YDudJWsFgUJ2YZc2Xq1Q_hNatLp3C","Authorization":"Bearer "+session.access_token},body:JSON.stringify({action:"status"})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Could not verify subscription.");const active=(d.subscriptions||[]).some(x=>x.status==="ACTIVE");el.textContent=active?"PayPal confirmed your active subscription. Your CenAI membership is ready.":"PayPal has not confirmed an active subscription yet. No membership has been granted; return to billing to check again. Unfinished checkout attempts expire and are cancelled."; }catch(e){el.textContent="Activation could not be verified: "+e.message;}})();
</script></main></body></html>
